services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notification_usr
      POSTGRES_PASSWORD: notification_pwd
      POSTGRES_DB: notification_db
    ports:
      - "5432:5432"
    volumes:
      - notification-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification_usr -d notification_db"]
      interval: 2s
      timeout: 2s
      retries: 15

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://notification_usr:notification_pwd@postgres:5432/notification_db?sslmode=disable
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  notification-postgres: