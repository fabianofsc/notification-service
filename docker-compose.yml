services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: notification
      POSTGRES_DB: notification_service
    ports:
      - "5432:5432"
    volumes:
      - notification-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification -d notification_service"]
      interval: 2s
      timeout: 2s
      retries: 15

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://notification:notification@postgres:5432/notification_service?sslmode=disable
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  notification-postgres: